version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      frontend-security:
        update-types: [patch, minor]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - "docker"
      - "dependencies"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "ci/cd"
      - "dependencies"
